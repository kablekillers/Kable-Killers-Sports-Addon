name: USA Sports Filter Tests
on:
  push:
    branches: [kable-killers-usa]
  workflow_dispatch:
jobs:
  filter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run standalone USA sports filter regression tests
        run: |
          node --check src/services/UsSportsFilter.js
          node --check src/manifest.js
          node --test tests/us-sports-filter.node.test.js
